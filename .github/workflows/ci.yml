name: Release CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "maintenance-*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run release:certify
      - name: Upload static performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-performance-report
          path: .performance/static-report.json
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    runs-on: ubuntu-latest
    needs: certify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e:run
      - name: Upload runtime performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-report
          path: test-results/performance-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-parity-report
          path: test-results/browser-parity-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
